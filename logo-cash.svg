<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0e0120"/>
      <stop offset="100%" stop-color="#06000e"/>
    </linearGradient>
  </defs>

  <!-- Fondo cuadrado redondeado -->
  <rect width="170" height="170" rx="38" fill="url(#bg)" stroke="#d8b15f" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Calendario: rectángulo con solo borde dorado, sin relleno -->
  <rect x="39" y="48" width="92" height="92" rx="22"
        fill="none" stroke="#d8b15f" stroke-width="6"/>

  <!-- Argolla izquierda -->
  <rect x="53" y="30" width="16" height="28" rx="8" fill="#d8b15f"/>

  <!-- Argolla derecha -->
  <rect x="101" y="30" width="16" height="28" rx="8" fill="#d8b15f"/>

  <!-- Arco circular -->
  <path d="M 58.4 122.6 A 39 39 0 0 1 86 56 A 39 39 0 0 1 113.6 67.4"
        fill="none" stroke="#d8b15f" stroke-opacity="0.9" stroke-width="5"
        stroke-linecap="round"/>

  <!-- Checkmark grande -->
  <polyline points="61,110 81,129 120,90"
            fill="none" stroke="#d8b15f" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Insignia Vettcash: moneda con $ -->
  <circle cx="134" cy="134" r="26" fill="#2437D6" stroke="#0e0120" stroke-width="6"/>
  <text x="134" y="146" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#FFCB2E">$</text>
</svg>
