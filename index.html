<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vettcash</title>
<script>try{var t=localStorage.getItem('caja_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --bg:#ECEEF3;--card:#fff;--tx:#12182B;--mut:#586177;--bd:#D3D8E4;--bd2:#B4BCCF;
  --ac:#2437D6;--ac2:#E3E6FB;--onac:#fff;--ok:#0B8F5E;--bad:#D63A3A;--warn:#A85A07;--tag:#FFCB2E;
  --disp:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#0D1120;--card:#151B30;--tx:#E9ECF5;--mut:#9AA3BA;--bd:#262D45;--bd2:#3A4466;--ac:#93A3FF;--ac2:#1F2750;--onac:#0D1120;--ok:#3DD68C;--bad:#FF7B7B;--warn:#F2A03D}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D1120;--card:#151B30;--tx:#E9ECF5;--mut:#9AA3BA;--bd:#262D45;--bd2:#3A4466;--ac:#93A3FF;--ac2:#1F2750;--onac:#0D1120;--ok:#3DD68C;--bad:#FF7B7B;--warn:#F2A03D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--body);font-variant-numeric:tabular-nums}
button{font-family:var(--body)}

/* barra superior y menú */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font:800 20px/1 var(--disp);letter-spacing:-.02em}
.logo img{width:30px;height:30px;border-radius:8px;display:block}
#stat{margin-left:auto;font-size:13px}
nav{display:flex;gap:2px;margin-left:8px}
nav button{position:relative;display:flex;align-items:center;gap:8px;padding:9px 13px;border:0;border-radius:10px;background:none;color:var(--mut);font:600 15px var(--body);cursor:pointer}
nav button svg{display:none;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--tx)}
nav button.on::after{content:'';position:absolute;left:13px;right:13px;bottom:2px;height:3px;border-radius:3px;background:var(--tag)}
main{max-width:1040px;margin:auto;padding:6px 16px 28px}

/* secciones: líneas finas en vez de tarjetas */
.card{padding:22px 0;border-top:1px solid var(--bd)}
main>.card:first-child{border-top:0}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px}
h2{font:700 20px/1.2 var(--disp);letter-spacing:-.015em;margin:0 0 14px}

/* cifras */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.stat{background:var(--card);padding:14px 16px}
.stat small{display:block;color:var(--mut);font-size:13px}
.grid .stat b{display:block;margin-top:2px;font:700 26px/1.15 var(--disp);letter-spacing:-.02em}
.grid .stat.hero{grid-column:span 2;background:var(--ac);color:var(--onac)}
.grid .stat.hero small{color:inherit;opacity:.8}
.grid .stat.hero b{font-size:38px}
.found .p{font:700 28px/1 var(--disp);letter-spacing:-.02em}
.total{font:800 40px/1 var(--disp);letter-spacing:-.03em}
.in{color:var(--ok);font-weight:650}.out{color:var(--bad);font-weight:650}.low{color:var(--warn);font-weight:650}
.mut{color:var(--mut)}
.void{opacity:.45;text-decoration:line-through}

/* controles */
button.b,button.s,button.d{min-height:44px;padding:0 16px;border-radius:10px;font:650 15px var(--body);cursor:pointer}
button.b{background:var(--ac);color:var(--onac);border:0}
button.b:hover{filter:brightness(1.1)}
button.s{background:transparent;color:var(--tx);border:1.5px solid var(--bd2)}
button.s:hover{border-color:var(--tx)}
button.d{background:transparent;color:var(--bad);border:1.5px solid var(--bd);min-height:36px;padding:0 12px;font-size:14px}
button.i{width:34px;height:34px;border:1.5px solid var(--bd2);border-radius:8px;background:none;color:var(--tx);font-size:18px;cursor:pointer}
td button.s{min-height:34px;padding:0 12px;font-size:14px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd2);border-radius:10px;min-height:44px;padding:0 12px;width:100%}
input[type=checkbox]{width:20px;min-height:0;height:20px;accent-color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input:focus-visible,select:focus-visible{outline-offset:0}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 5px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.row>.fit{flex:none;min-width:0}
.field{margin-bottom:12px}

/* tablas */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--mut);padding:8px;border-bottom:1.5px solid var(--bd2)}
td{padding:11px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
td.r,th.r{text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--bd2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:22px 8px}
.flash{color:var(--ok);font-weight:650;min-height:22px;margin-top:8px}

/* servicios guardados: chapitas */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button.s{position:relative;padding-left:32px;border-radius:999px 12px 12px 999px}
.chips button.s::before{content:'';position:absolute;left:13px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:2px solid var(--bd2);background:var(--bg)}
.chips button.s:hover{background:var(--tag);border-color:var(--tag);color:#12182B}

/* sugerencias */
.sug{margin-top:8px;border:1.5px solid var(--bd2);border-radius:12px;background:var(--card);overflow:hidden}
.sug div{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.sug div+div{border-top:1px solid var(--bd)}
.sug div:hover{background:var(--ac2)}

/* venta: el ticket */
.vgrid{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.vleft{display:contents}
.vleft>.card:first-child{order:1;border-top:0}
.ticket{order:2}
.vleft>.card:last-child{order:3}
@media (min-width:900px){
  .vgrid{grid-template-columns:minmax(0,1fr) 420px;gap:32px;align-items:start}
  .vleft{display:block}
  .vleft>.card:first-child{padding-top:6px}
  .ticket{position:sticky;top:76px;margin-top:14px}
}
.ticket{
  --tx:#12182B;--mut:#5B6478;--bd:#CBD0DE;--bd2:#9AA3BA;--card:#fff;--bg:#ECEEF3;
  --ac:#2437D6;--onac:#fff;--ok:#0B8F5E;--bad:#D63A3A;
  background:#fff;color:var(--tx);padding:24px 22px 38px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
}
.ticket th{border-bottom:1.5px dashed var(--bd2)}
.ticket td{border-bottom:1px dashed var(--bd2)}
.ticket .tag{background:var(--tag);border-color:var(--tag);color:#12182B}
.ticket td input{border:0;border-bottom:1.5px dashed var(--bd2);border-radius:0;background:transparent;min-height:34px;padding:0 2px;text-align:right}
.ticket .row input:not(:disabled),.ticket select{background:#fff}
@keyframes feed{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -20px 0)}}
.ticket.print{animation:feed .55s cubic-bezier(.2,.7,.2,1)}

.line{padding:12px 0;border-bottom:1px dashed var(--bd2)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:650}
.lc{display:flex;align-items:center;gap:12px;margin-top:8px}
.lc input{width:100px;min-height:38px;border:0;border-bottom:1.5px dashed var(--bd2);border-radius:0;background:transparent;padding:0 2px}
.qty{display:flex;align-items:center;gap:10px}.qty b{min-width:18px;text-align:center}
.ln .sub{font-weight:700;white-space:nowrap}
.lc .d{margin-left:auto}
.ticket .total{margin-top:4px}
.pay{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:18px}
.pay>div:first-child{flex:1 1 auto}
.pay button{min-height:54px;font-size:17px;padding:0 30px}
@media (max-width:759px){.pay .fit{flex:1 1 100%}.pay button{width:100%}.total{font-size:36px}}
#q{min-height:54px;font-size:17px;border-width:2px;border-color:var(--ac)}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;vertical-align:middle}
.seg{display:flex;gap:6px}.seg .fit{flex:1}.seg button{width:100%;min-height:40px;padding:0 6px}
.themebtn{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--mut);cursor:pointer}
.themebtn:hover{color:var(--tx);background:var(--ac2)}
.chk{min-height:30px;padding:0 10px;font-size:13px;margin-left:6px}
.chk.ok{color:var(--ok);border-color:var(--ok)}
/* diálogos y cámara */
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);padding:24px;width:min(460px,calc(100vw - 24px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(13,17,32,.55)}
.found{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
video{width:100%;border-radius:12px;background:#000}
details{margin-bottom:12px}summary{cursor:pointer;color:var(--ac);font-weight:650;margin-bottom:8px}
.bills{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.bills div{display:flex;align-items:center;gap:8px}.bills span{width:64px;text-align:right;color:var(--mut)}

/* celular: menú abajo, al alcance del pulgar */
@media (max-width:759px){
  body{padding-bottom:84px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:11.5px}
  nav button svg{display:block}
  nav button.on{color:var(--ac)}
  nav button.on::after{left:50%;right:auto;width:28px;margin-left:-14px;top:-6px;bottom:auto;border-radius:0 0 3px 3px}
  .hide-s{display:none}
  .grid .stat.hero b{font-size:34px}
  .grid .stat b{font-size:23px}
  td,th{padding-left:4px;padding-right:4px}
  td .d{padding:0 8px;min-height:30px;font-size:13px}
  td:first-child{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,main,nav{display:none}dialog{position:static;border:0;width:auto;max-height:none}.noprint{display:none}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><img src="logo-cash.svg" alt="">Vettcash</div>
  <nav id="nav">
    <button data-v="caja"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3z"/><path d="M3 11h18"/><path d="M16 15h2"/></svg><span>Caja</span></button>
    <button data-v="vender"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14M7 5v14M11 5v14M14 5v14M18 5v14M21 5v14"/></svg><span>Vender</span></button>
    <button data-v="stock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg><span>Stock</span></button>
    <button data-v="gan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-4 3 2 5-6"/></svg><span>Ganancias</span></button>
    <button data-v="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Historial</span></button>
  </nav>
  <span id="stat" class="mut"></span>
  <button id="themeBtn" class="themebtn" onclick="cycleTheme()"></button>
</div></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

<script>
/* ===== Capa de datos =====
   Hoy guarda en localStorage. Para pasar a Supabase / Vetturno se reemplaza
   solo este objeto (load/save) por llamadas a las tablas products, services, movements, sessions. */
const DB = {
  load(k){ try{ return JSON.parse(localStorage.getItem('caja_'+k)) || []; }catch{ return []; } },
  save(k,v){ localStorage.setItem('caja_'+k, JSON.stringify(v)); }
};
const S = { products: DB.load('products'), services: DB.load('services'), movements: DB.load('movements'), sessions: DB.load('sessions'), stocklog: DB.load('stocklog'), settings: DB.load('settings') };
const persist = k => { DB.save(k, S[k]); scheduleSync(); };

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2}).format(n||0);
const fdt = iso => new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dayOf = iso => { const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const today = () => dayOf(new Date().toISOString());
const METHODS = ['efectivo','tarjeta','transferencia','qr'];
const ML = m => m==='qr' ? 'QR' : m.charAt(0).toUpperCase()+m.slice(1);
const mopts = sel => METHODS.map(m=>`<option value="${m}"${m===sel?' selected':''}>${ML(m)}</option>`).join('');
const num = v => { let s = String(v ?? '').trim(); if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isNaN(n) ? 0 : n; };
const r2 = n => Math.round(n*100)/100;
const DEN = [20000,10000,2000,1000,500,200,100,50,20,10];

let view = 'caja';
let cart = [];
let pay = [{method:'efectivo', amount:0}];
let adj = 0, who = '';
let stockFound = null;
let fast = false;

const openSession = () => S.sessions.find(s => !s.closedAt);
function summary(sess){
  const ms = S.movements.filter(m => m.sessionId === sess.id);
  const r = { in:0, out:0, ret:0, apo:0, byIn:{}, byOut:{}, ms };
  METHODS.forEach(x => { r.byIn[x]=0; r.byOut[x]=0; });
  ms.forEach(m => { if(m.voided) return; if(m.type==='ingreso'){ r.in+=m.amount; r.byIn[m.method]+=m.amount; } else if(m.type==='retiro'){ r.ret+=m.amount; } else if(m.type==='aporte'){ r.apo+=m.amount; } else { r.out+=m.amount; r.byOut[m.method]+=m.amount; } });
  r.expectedCash = sess.opening + r.byIn.efectivo - r.byOut.efectivo - r.ret + r.apo;
  return r;
}

/* ===== Diálogo y cámara ===== */
const dlg = $('#dlg');
function stopCam(){ const v = dlg.querySelector('video'); if(v && v.srcObject) v.srcObject.getTracks().forEach(t=>t.stop()); }
function modal(html){ dlg.innerHTML = html; if(!dlg.open) dlg.showModal(); }
function closeModal(){ stopCam(); dlg.close(); dlg.innerHTML=''; }
dlg.addEventListener('close', stopCam);

async function cameraScan(onCode){
  if(!('BarcodeDetector' in window)){ alert('Tu navegador no soporta lectura de códigos con cámara. Usá un lector USB/Bluetooth (funciona como teclado) o escribí el código.'); return; }
  modal('<h2>Escanear código</h2><video id="cam" playsinline muted></video><p class="mut">Apuntá al código de barras.</p><button class="s" onclick="closeModal()">Cancelar</button>');
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch{ closeModal(); alert('No se pudo acceder a la cámara (necesita permiso y https o localhost).'); return; }
  const v = $('#cam'); v.srcObject = stream; await v.play();
  const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
  const loop = async () => {
    if(!dlg.open || !v.srcObject) return;
    try{ const r = await det.detect(v); if(r.length){ const code = r[0].rawValue; closeModal(); onCode(code); return; } }catch{}
    setTimeout(loop, 250);
  };
  loop();
}

/* ===== Sincronización con Supabase =====
   Local primero: la app siempre lee y escribe en localStorage. Cada cambio se sube en segundo plano
   y, al abrir o volver a tener internet, se baja lo que cargaron otros dispositivos.
   Antes de usarla hay que correr supabase/schema.sql y crear el usuario en Authentication. */
const SB_URL = 'https://usrbmmnnqecurmvwlodl.supabase.co';
const SB_KEY = 'sb_publishable_K_VS1SvQAQhkPw3Ja71irQ_GwH2JoSd'; // clave pública: está pensada para ir en el código
let sb = null;
try{ if(window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){}
const COLS = ['products','services','movements','sessions','stocklog','settings'];
let user = null, syncing = false, again = false, syncTimer = null, syncState = 'ok';
const syncMap = k => { try{ return JSON.parse(localStorage.getItem('caja_sync_'+k)) || {}; }catch{ return {}; } };
const saveMap = (k,m) => localStorage.setItem('caja_sync_'+k, JSON.stringify(m));
const chunks = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const hasAccess = () => !sb ? !!localStorage.getItem('caja_user_email') : (!!user || (!navigator.onLine && !!localStorage.getItem('caja_user_email')));

function setStatus(s){ syncState = s; updateBar(); }
function updateBar(){
  const el = $('#stat'); if(!el) return;
  if(!sb || !hasAccess()){ el.textContent = ''; return; }
  const st = {ok:'☁ sincronizado', sync:'☁ sincronizando…', err:'⚠ error al sincronizar', off:'☁ sin conexión'}[syncState] || '';
  el.innerHTML = `${st} · <a href="#" onclick="logout();return false" style="color:inherit">Salir</a>`;
}
function scheduleSync(){ if(!sb || !user) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), 1200); }

// Si una tabla todavía no existe en Supabase (ej. la del historial de stock), se la saltea sin romper el resto.
const missingTable = e => !!e && (e.code==='PGRST205' || e.code==='42P01' || /could not find the table|does not exist/i.test(e.message||''));
async function pushOne(k){
  const map = syncMap(k), cur = {};
  S[k].forEach(d => cur[d.id] = JSON.stringify(d));
  const up = S[k].filter(d => map[d.id] !== cur[d.id]);
  const del = Object.keys(map).filter(id => !(id in cur));
  for(const part of chunks(up, 400)){
    const { error } = await sb.from(k).upsert(part.map(d => ({id:d.id, data:d, updated_at:new Date().toISOString()})));
    if(error) throw error;
    part.forEach(d => map[d.id] = cur[d.id]); saveMap(k, map);
  }
  for(const part of chunks(del, 200)){
    const { error } = await sb.from(k).delete().in('id', part);
    if(error) throw error;
    part.forEach(id => delete map[id]); saveMap(k, map);
  }
}
async function pushAll(){
  for(const k of COLS){
    try{ await pushOne(k); }catch(e){ if(!missingTable(e)) throw e; console.warn('Falta la tabla en Supabase:', k); }
  }
}
async function pullOne(k){
  let rows = [];
  for(let from = 0;; from += 1000){
    const { data, error } = await sb.from(k).select('id,data').range(from, from+999);
    if(error) throw error;
    rows = rows.concat(data);
    if(data.length < 1000) break;
  }
  const remote = {}, newMap = {}, oldMap = syncMap(k), local = {};
  rows.forEach(r => { remote[r.id] = r.data; newMap[r.id] = JSON.stringify(r.data); });
  S[k].forEach(d => local[d.id] = d);
  const out = [];
  for(const id in remote){
    const l = local[id];
    // si el local tiene un cambio todavía no subido, gana el local
    if(l && oldMap[id] !== undefined && JSON.stringify(l) !== oldMap[id]) out.push(l); else out.push(remote[id]);
  }
  for(const id in local){
    if(!(id in remote) && (!(id in oldMap) || JSON.stringify(local[id]) !== oldMap[id])) out.push(local[id]);
  }
  if(k==='movements' || k==='stocklog') out.sort((a,b) => a.ts < b.ts ? -1 : 1);
  if(k==='sessions') out.sort((a,b) => a.openedAt < b.openedAt ? -1 : 1);
  S[k] = out; DB.save(k, out); saveMap(k, newMap);
}
async function pullAll(){
  for(const k of COLS){
    try{ await pullOne(k); }catch(e){ if(!missingTable(e)) throw e; console.warn('Falta la tabla en Supabase:', k); }
  }
}

async function sync(pull){
  if(!sb || !user) return;
  if(!navigator.onLine){ setStatus('off'); return; }
  if(syncing){ again = true; return; }
  syncing = true; setStatus('sync');
  const before = pull ? JSON.stringify(COLS.map(k => S[k])) : null;
  try{
    await pushAll();
    if(pull) await pullAll();
    setStatus('ok');
    if(pull && JSON.stringify(COLS.map(k => S[k])) !== before && !dlg.open) render();
  }catch(e){ console.error(e); setStatus('err'); }
  syncing = false;
  if(again){ again = false; scheduleSync(); }
}

/* ===== RESPALDO =====
   Al cerrar el día se guarda un JSON en la carpeta elegida (ej. Google Drive para escritorio)
   o, si no hay carpeta, se descarga. Cuando haya Supabase esto pasa a ser secundario. */
const idbOpen = () => new Promise((res,rej) => { const r = indexedDB.open('caja_meta',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbGet = async k => { const db = await idbOpen(); return new Promise((res,rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
const idbSet = async (k,v) => { const db = await idbOpen(); return new Promise((res,rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
const snapshot = () => JSON.stringify({version:1, exportedAt:new Date().toISOString(), data:{products:S.products, services:S.services, movements:S.movements, sessions:S.sessions, stocklog:S.stocklog, settings:S.settings}}, null, 1);
async function backupTo(){
  const name = `respaldo-caja-${today()}.json`;
  try{
    const h = window.showDirectoryPicker ? await idbGet('dir') : null;
    if(h){
      let p = await h.queryPermission({mode:'readwrite'});
      if(p!=='granted') p = await h.requestPermission({mode:'readwrite'});
      if(p==='granted'){ const f = await h.getFileHandle(name,{create:true}); const w = await f.createWritable(); await w.write(snapshot()); await w.close(); return `✔ Respaldo guardado en la carpeta "${h.name}" (${name}).`; }
    }
  }catch(e){}
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([snapshot()],{type:'application/json'})); a.download = name; a.click();
  return `Respaldo descargado: ${name}. Elegí una carpeta de Drive en la pestaña Caja para que se guarde sola.`;
}
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){ alert('Elegir carpeta funciona en Chrome o Edge. En otros navegadores el respaldo se descarga.'); return; }
  try{ const h = await showDirectoryPicker({mode:'readwrite'}); await idbSet('dir', h); localStorage.setItem('caja_dirname', h.name); render(); }catch(e){}
}
async function backupNow(){ const m = await backupTo(); alert(m); }
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    let j; try{ j = JSON.parse(rd.result); }catch{ alert('El archivo no es un respaldo válido.'); return; }
    const d = j && j.data;
    if(!d || !Array.isArray(d.products) || !Array.isArray(d.movements) || !Array.isArray(d.sessions)){ alert('El archivo no es un respaldo de esta app.'); return; }
    if(!confirm(`Esto REEMPLAZA los datos actuales por los del respaldo (${d.products.length} productos, ${d.movements.length} movimientos). ¿Continuar?`)) return;
    ['products','services','movements','sessions','stocklog','settings'].forEach(k => { S[k] = d[k] || []; persist(k); });
    cart = []; render();
  };
  rd.readAsText(file);
}
function backupCard(){
  const dn = localStorage.getItem('caja_dirname');
  return `<div class="card"><h2>Respaldo</h2>
    <p class="mut" style="margin-top:0">${dn?`Al cerrar el día se guarda en la carpeta <b>${esc(dn)}</b>.`:'Al cerrar el día se descarga un archivo. Elegí una carpeta de Google Drive para que se guarde sola.'}</p>
    <div class="row"><div class="fit"><button class="s" onclick="pickBackupFolder()">Elegir carpeta</button></div><div class="fit"><button class="s" onclick="backupNow()">Respaldar ahora</button></div>
    <div class="fit"><button class="s" onclick="$('#bkf').click()">Restaurar respaldo</button><input type="file" id="bkf" accept=".json,application/json" hidden onchange="if(this.files[0])importBackup(this.files[0]);this.value=''"></div></div></div>`;
}

/* ===== CUENTAS DE COBRO =====
   Tarjeta (Point), transferencia y QR entran a una de dos cuentas de Mercado Pago.
   Cada cobro guarda la cuenta ('a' o 'b') y si ya se verificó contra la app de Mercado Pago. */
const DEFAULT_SET = {id:'main', accounts:['MP Nadia','MP Guido'], defaultAcc:'a', usdType:'oficial', usdRate:0};
const getSet = () => Object.assign({}, DEFAULT_SET, S.settings[0] || {});
const accKey = i => String.fromCharCode(97 + i);
const accKeys = () => getSet().accounts.map((_, i) => accKey(i));
const accLabel = k => { const i = k.charCodeAt(0) - 97; return getSet().accounts[i] || ('Cuenta ' + (i + 1)); };
const defAcc = () => { const s = getSet(); return accKeys().includes(s.defaultAcc) ? s.defaultAcc : 'a'; };
const aopts = sel => accKeys().map(k => `<option value="${k}"${k===sel?' selected':''}>${esc(accLabel(k))}</option>`).join('');
function saveSettings(patch){
  const nxt = Object.assign({}, getSet(), patch);
  if(S.settings.length) S.settings[0] = nxt; else S.settings.push(nxt);
  persist('settings');
}
function saveAccName(i, v){
  const a = getSet().accounts.slice(); a[i] = v.trim() || (i===0 ? 'MP Nadia' : i===1 ? 'MP Guido' : 'Cuenta ' + (i + 1));
  saveSettings({accounts:a}); render();
}
function cuentasCard(){
  const s = getSet();
  return `<div class="card"><h2>Cuentas de cobro</h2>
    <p class="mut" style="margin-top:0">Para tarjeta (Point), transferencia y QR elegís en qué cuenta de Mercado Pago entró cada cobro.</p>
    <div class="row">${s.accounts.map((n, i) => `<div><label>Cuenta ${i + 1}</label><input class="accin" value="${esc(n)}" onchange="saveAccName(${i},this.value)"></div>`).join('')}</div>
    <div class="row" style="margin-top:12px"><div class="fit"><button class="s" onclick="addAccount()">+ Agregar cuenta</button></div>${s.accounts.length > 1 ? '<div class="fit"><button class="d" onclick="removeAccount()">Quitar la última</button></div>' : ''}</div>
    <div class="field" style="margin-top:12px"><label>Cuenta que se propone al cobrar</label><select onchange="saveSettings({defaultAcc:this.value});render()">${aopts(defAcc())}</select></div></div>`;
}
function addAccount(){
  const a = getSet().accounts.slice();
  if(a.length >= 10){ alert('Podés tener hasta 10 cuentas.'); return; }
  a.push('Cuenta ' + (a.length + 1));
  saveSettings({accounts:a}); render();
  const inputs = document.querySelectorAll('.accin'); const last = inputs[inputs.length - 1];
  if(last){ last.scrollIntoView({block:'center'}); last.focus(); last.select(); }
}
function removeAccount(){
  const s = getSet(), a = s.accounts.slice();
  if(a.length <= 1) return;
  const key = accKey(a.length - 1);
  if(S.movements.some(m => m.account === key)){ alert('"' + accLabel(key) + '" tiene cobros registrados y no se puede quitar.'); return; }
  if(!confirm('¿Quitar "' + a[a.length - 1] + '"?')) return;
  a.pop();
  saveSettings({accounts:a, defaultAcc: s.defaultAcc===key ? 'a' : s.defaultAcc}); render();
}
const isPending = m => m.type==='ingreso' && m.method!=='efectivo' && !m.verified && !m.voided;
function toggleVerified(id){
  const m = S.movements.find(x => x.id===id); if(!m) return;
  m.verified = !m.verified; m.verifiedAt = m.verified ? new Date().toISOString() : null;
  persist('movements'); render();
}

/* Balance del día en dólares: la cotización se trae de dolarapi.com (precio de venta) o se escribe a mano. */
const fmtUsd = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
function usdInfo(){
  const el = $('#usdinfo'); if(!el) return;
  const s = openSession(); if(!s) return;
  const r = summary(s), bal = r.in - r.out, rate = num($('#usdr') ? $('#usdr').value : 0);

async function fetchUsd(auto){
  const t = $('#usdt'); if(!t) return;
  const msg = txt => { const m = $('#usdmsg'); if(m) m.textContent = txt; };

  try{
    const res = await fetch('https://dolarapi.com/v1/dolares/' + t.value);
    if(!res.ok) throw new Error('http ' + res.status);
    const d = await res.json();
    if(!(d.venta > 0)) throw new Error('sin dato');
    if(!$('#usdr')) return;
    $('#usdr').value = d.venta;
    msg('Dólar ' + t.options[t.selectedIndex].text + ' (venta), actualizado ' + new Date(d.fechaActualizacion).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));

  }catch(e){
    msg(auto ? 'No se pudo traer la cotización. Podés escribirla a mano.' : 'Sin conexión o servicio no disponible. Escribila a mano.');

      ${(() => { const n = r.ms.filter(isPending).length; return n ? `<tr><td colspan="2" class="low">⚠ ${n} cobro(s) sin verificar en Mercado Pago</td></tr>` : ''; })()}
      <tr><td><b>Efectivo esperado</b></td><td class="r"><b>${fmt(s.expected)}</b></td></tr>
      <tr><td><b>Efectivo contado</b></td><td class="r"><b>${fmt(s.counted)}</b></td></tr>
      <tr><td>Diferencia</td><td class="r ${diff<0?'out':diff>0?'in':''}">${fmt(diff)}</td></tr>
      <tr><td><b>Balance del día</b> (ingresos − egresos)</td><td class="r"><b>${fmt(s.balance)}</b></td></tr>
      ${s.usdRate ? `<tr><td>En dólares (a ${fmt(s.usdRate)})</td><td class="r">${fmtUsd(s.balance / s.usdRate)}</td></tr>` : ''}

function addByCode(code){
  code = String(code).trim();

  if(sale.length) return addProduct(sale[0].id);
  const t = code.toLowerCase();
  const m = S.products.filter(x => !x.internal && x.name.toLowerCase().includes(t));
  if(m.length===1) return addProduct(m[0].id);
  if(/^\d{6,}$/.test(code)){ if(confirm('Código '+code+' no está en stock. ¿Cargarlo ahora?')){ stockFound={code,product:null}; view='stock'; render(); newProductDlg(code); } }

function autoOpen(p, need, opened){
  if(p.stock >= need) return;
  const parent = S.products.find(x => x.contains && x.contains.to===p.id);
  if(!parent) return;
  const per = parent.contains.qty, boxes = Math.ceil((need - p.stock) / per);
  autoOpen(parent, boxes, opened);
  const n = Math.min(boxes, parent.stock);
  if(n < 1) return;
  parent.stock -= n; p.stock += n * per;
  opened.push({from:parent, to:p, n, add:n * per});
}
function toast(text){
  const t = document.createElement('div');
  t.textContent = text;
  t.setAttribute('role', 'status');
  t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:84px;max-width:min(92vw,460px);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3)';
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}
function qty(i,d){ cart[i].qty+=d; if(cart[i].qty<1) cart.splice(i,1); drawCart(); }
function cobrar(){
  if(!cart.length) return;
  const {total} = totals();
  const extra = pay.slice(1).filter(p => p.amount>0);
  const first = r2(total - extra.reduce((a,p)=>a+p.amount,0));
  if(first<=0){ alert('Los pagos superan el total de la venta.'); return; }
  // si falta stock de una presentación, se abre la más grande que la contiene (caja → blister → unidad)
  const snap = S.products.map(p => [p, p.stock]), opened = [];
  cart.forEach(l => { const p = l.productId && S.products.find(x => x.id===l.productId); if(p) autoOpen(p, l.qty, opened); });
  const low = cart.filter(l => l.productId && (S.products.find(p=>p.id===l.productId)||{stock:0}).stock < l.qty);
  if(low.length && !confirm('Stock insuficiente en: '+low.map(l=>l.name).join(', ')+'. ¿Cobrar igual? (el stock quedará en 0)')){ snap.forEach(([p, s]) => { p.stock = s; }); return; }
  opened.forEach(o => { logStock(o.from, -o.n, 'Apertura', 'abierta automáticamente en una venta'); logStock(o.to, o.add, 'Apertura', 'de ' + o.n + ' ' + (o.from.presentation || o.from.name) + ' (venta)'); });
  if(opened.length) toast(opened.map(o => 'Se abrió ' + o.n + ' ' + (o.from.presentation || o.from.name) + ' → +' + o.add + ' ' + (o.to.presentation || o.to.name)).join(' · '));
  cart.forEach(l => { if(l.productId){ const p=S.products.find(x=>x.id===l.productId); if(p) p.stock=Math.max(0,p.stock-l.qty); } });
  const saleId = uid(), ts = new Date().toISOString(), sessionId = openSession().id;
  const concept = 'Venta' + (adj ? ` (${adj>0?'+':''}${adj}%)` : '');
  const parts = [{method:pay[0].method, amount:first, account:pay[0].account}, ...extra.map(p=>({method:p.method, amount:p.amount, account:p.account}))];
  parts.forEach((p,i) => S.movements.push({id:uid(), ts, type:'ingreso', concept, amount:p.amount, method:p.method, account:p.method!=='efectivo' ? (p.account||defAcc()) : '', sessionId, saleId, who:who.trim(),
    items: i===0 ? cart.map(l=>({productId:l.productId,name:l.name,price:l.price,qty:l.qty})) : []}));
  persist('products'); persist('movements');
  cart=[]; pay=[{method:'efectivo',amount:0}]; adj=0; who=''; render();
}

    quick(p => {
      stockFound = {code, product:p};
      if(p.stock < 1){ flash(pname(p) + ' no tiene stock para descontar.', true); drawFound(); return; }
      p.stock--; persist('products'); logStock(p, -1, 'Consultorio', 'descuento rápido');
      flash('−1 ' + pname(p) + ' → stock ' + p.stock); drawFound(); drawList(); drawStockLog();
    });
    return;
  }
  if(fast){
    if(same.length){
      quick(p => { p.stock++; persist('products'); logStock(p, 1, 'Ingreso', 'carga rápida'); stockFound={code,product:p}; flash('+1 ' + pname(p) + ' → stock ' + p.stock); drawFound(); drawList(); drawStockLog(); });
      return;
    }
    stockFound={code,product:null}; flash(''); drawFound(); newProductDlg(code); return;
  }
  flash('');
  stockFound = {code, product:same[0]||null};
  drawFound();
}

function importCsv(file){
  const rd = new FileReader();
  rd.onload = () => {
    const lines = String(rd.result).replace(/^﻿/,'').split(/\r?\n/).filter(l => l.trim());
    if(lines.length<2){ alert('El archivo está vacío.'); return; }
    const sep = lines[0].includes(';') ? ';' : ',';
    const parse = l => { const out=[]; let cur='', q=false; for(const c of l){ if(c==='"') q=!q; else if(c===sep && !q){ out.push(cur); cur=''; } else cur+=c; } out.push(cur); return out.map(x=>x.trim()); };
    const head = parse(lines[0]).map(h => h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
    const ix = n => head.indexOf(n);
    const iC=ix('codigo'), iN=ix('nombre'), iP=ix('precio'), iCo=ix('costo'), iS=ix('stock'), iCat=ix('categoria'), iM=ix('minimo'), iPr=ix('presentacion');
    if(iC<0 || iN<0 || iP<0){ alert('Faltan columnas. Necesito al menos: codigo, nombre, precio. Opcionales: costo, stock, categoria, minimo, presentacion.'); return; }
    let nuevos=0, act=0, skip=0;
    lines.slice(1).forEach(l => {
      const c = parse(l), barcode = c[iC], name = c[iN], price = num(c[iP]);
      if(!barcode || !name || price<=0){ skip++; return; }
      const d = { barcode, name, price };
      if(iPr>=0) d.presentation = c[iPr] || '';
      if(iCo>=0) d.cost = num(c[iCo]);
      if(iS>=0) d.stock = Math.round(num(c[iS]));
      if(iCat>=0) d.category = c[iCat];
      if(iM>=0 && c[iM]) d.min = Math.round(num(c[iM]));
      const ex = S.products.find(p => presKey(p.barcode, p.presentation)===presKey(barcode, d.presentation));
      if(ex){ Object.assign(ex, d); act++; } else { S.products.push({id:uid(), cost:0, stock:0, min:3, category:'', ...d}); nuevos++; }
    });
    persist('products'); render();
    $('#msg').textContent = `Importados: ${nuevos} nuevos, ${act} actualizados${skip?`, ${skip} filas omitidas`:''}.`;
  };
  rd.readAsText(file);
}

/* ===== GANANCIAS =====
   Ganancia = ventas (ingresos) − gastos (egresos). Las anuladas no cuentan.
   Se calcula siempre desde los movimientos, así que se actualiza sola con cada venta o gasto. */
let ganKind = 'dia';
const GK = {
  dia:    {cur:'Hoy',         prev:'ayer',              n:14},
  semana: {cur:'Esta semana', prev:'la semana pasada',  n:8},
  mes:    {cur:'Este mes',    prev:'el mes pasado',     n:12},
  anio:   {cur:'Este año',    prev:'el año pasado',     n:5}
};
function periodRange(kind, off){
  const n = new Date(); let a, b;
  if(kind==='dia'){ a = new Date(n.getFullYear(), n.getMonth(), n.getDate()+off); b = new Date(a.getFullYear(), a.getMonth(), a.getDate()+1); }
  else if(kind==='semana'){ const dow = (n.getDay()+6)%7; a = new Date(n.getFullYear(), n.getMonth(), n.getDate()-dow+off*7); b = new Date(a.getFullYear(), a.getMonth(), a.getDate()+7); }
  else if(kind==='mes'){ a = new Date(n.getFullYear(), n.getMonth()+off, 1); b = new Date(n.getFullYear(), n.getMonth()+off+1, 1); }
  else { a = new Date(n.getFullYear()+off, 0, 1); b = new Date(n.getFullYear()+off+1, 0, 1); }
  return [a, b];
}
function agg(a, b){
  const r = {ing:0, gas:0};
  S.movements.forEach(m => {
    if(m.voided) return;
    const t = new Date(m.ts); if(t < a || t >= b) return;
    if(m.type==='retiro' || m.type==='aporte') return;
    if(m.type==='ingreso') r.ing += m.amount; else r.gas += m.amount;
  });
  r.neta = r.ing - r.gas;
  return r;
}
const plabel = (k, a) => k==='dia' ? a.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})
  : k==='semana' ? 'sem '+a.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})
  : k==='mes' ? a.toLocaleDateString('es-AR',{month:'short',year:'2-digit'}) : String(a.getFullYear());
function vGan(){
  const rate = getSet().usdRate, utype = getSet().usdType;
  const cards = Object.keys(GK).map(k => {
    const [a,b] = periodRange(k,0), [pa,pb] = periodRange(k,-1);
    const r = agg(a,b), p = agg(pa,pb);
    const dl = p.neta ? Math.round((r.neta-p.neta)/Math.abs(p.neta)*100) : null;
    return `<div class="stat"><small>${GK[k].cur}</small><b class="${r.neta<0?'out':'in'}">${fmt(r.neta)}</b>${rate ? `<div class="mut" style="font-size:13px">≈ ${fmtUsd(r.neta / rate)}</div>` : ''}
      <div class="mut" style="font-size:12px;margin-top:6px">Ventas ${fmt(r.ing)}<br>Gastos ${fmt(r.gas)}</div>
      ${dl===null?'':`<div style="font-size:12px;margin-top:4px" class="${dl<0?'out':'in'}">${dl<0?'▼':'▲'} ${Math.abs(dl)}% vs ${GK[k].prev}</div>`}</div>`;
  }).join('');
  const rows = [];
  for(let i = GK[ganKind].n-1; i >= 0; i--){ const [a,b] = periodRange(ganKind,-i); rows.push({a, r:agg(a,b)}); }
  const max = Math.max(1, ...rows.map(x => Math.abs(x.r.neta)));
  const chart = `<div style="display:flex;gap:4px;align-items:flex-end;height:130px;margin-top:14px">${rows.map(x=>`<div title="${plabel(ganKind,x.a)}: ${fmt(x.r.neta)}" style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end"><div style="height:${Math.max(2,Math.abs(x.r.neta)/max*100)}%;background:var(${x.r.neta<0?'--bad':'--ac'});border-radius:4px 4px 0 0"></div></div>`).join('')}</div>
    <div style="display:flex;gap:4px">${rows.map(x=>`<div class="mut" style="flex:1;font-size:10px;text-align:center;overflow:hidden;white-space:nowrap">${plabel(ganKind,x.a)}</div>`).join('')}</div>`;
  $('#app').innerHTML = `<div class="card"><h2>Ganancias</h2><div class="grid">${cards}</div>
    <p class="mut" style="margin:12px 0 0;font-size:12px">Ganancia = ventas − gastos (todos los egresos). Los movimientos anulados no cuentan.</p>
    <div class="row" style="margin-top:10px;align-items:center"><div class="fit mut" style="font-size:13px">Dólar</div>
    <div class="fit"><select aria-label="Tipo de dólar" onchange="setUsdType(this.value)" style="min-height:36px">${[['oficial','Oficial'],['blue','Blue'],['bolsa','MEP']].map(([v,l]) => `<option value="${v}"${utype===v?' selected':''}>${l}</option>`).join('')}</select></div>
    <div class="mut" style="font-size:13px">${rate ? 'precio de venta a ' + fmt(rate) + ' por dólar, de hoy, para todos los períodos' : 'cotización no disponible'}</div></div></div>
    <div class="card"><h2>Evolución</h2><div class="seg">
    ${Object.keys(GK).map(k=>`<div class="fit"><button class="${k===ganKind?'b':'s'}" onclick="ganKind='${k}';vGan()">${{dia:'Días',semana:'Semanas',mes:'Meses',anio:'Años'}[k]}</button></div>`).join('')}</div>
    ${chart}
    <table style="margin-top:14px"><tr><th>Período</th><th class="r">Ventas</th><th class="r">Gastos</th><th class="r">Ganancia</th></tr>
    ${rows.slice().reverse().map(x=>`<tr><td>${plabel(ganKind,x.a)}</td><td class="r">${fmt(x.r.ing)}</td><td class="r">${fmt(x.r.gas)}</td><td class="r ${x.r.neta<0?'out':'in'}">${fmt(x.r.neta)}</td></tr>`).join('')}</table></div>`;
  refreshRate();
}

/* ===== HISTORIAL ===== */
let histDay = today(), histPending = false;
function vHist(){
  const dayMs = S.movements.filter(m => dayOf(m.ts)===histDay);
  const ms = (histPending ? S.movements.filter(isPending) : dayMs).slice().reverse();
  const live = dayMs.filter(m => !m.voided);
  const inn = live.filter(m=>m.type==='ingreso').reduce((a,m)=>a+m.amount,0), out = live.filter(m=>m.type==='egreso').reduce((a,m)=>a+m.amount,0);
  const byM = METHODS.map(x => `${ML(x)} ${fmt(live.filter(m=>m.type==='ingreso'&&m.method===x).reduce((a,m)=>a+m.amount,0))}`).join(' · ');
  const accs = accKeys().map(k => {
    const l = live.filter(m => m.type==='ingreso' && m.account===k);
    const pend = l.filter(m => !m.verified).length;
    return `${esc(accLabel(k))} ${fmt(l.reduce((a,m)=>a+m.amount,0))}${pend ? ` (${pend} sin verificar)` : ''}`;
  }).join(' · ');
  const [ma, mb] = periodRange('mes', 0);
  const monthAccs = accKeys().map(k => `${esc(accLabel(k))} ${fmt(S.movements.filter(m => !m.voided && m.type==='ingreso' && m.account===k && new Date(m.ts)>=ma && new Date(m.ts)<mb).reduce((a,m)=>a+m.amount,0))}`).join(' · ');
  const pendAll = S.movements.filter(isPending).length;
  $('#app').innerHTML = `<div class="card"><div class="row"><div><label>Día</label><input type="date" id="hd" value="${histDay}"></div>
    <div class="fit"><button class="s" onclick="exportCsv()">Exportar CSV (todo)</button></div></div>
    <div class="grid" style="margin-top:12px"><div class="stat"><small>Ingresos</small><b class="in">${fmt(inn)}</b></div><div class="stat"><small>Egresos</small><b class="out">${fmt(out)}</b></div><div class="stat"><small>Saldo</small><b>${fmt(inn-out)}</b></div></div>
    <p class="mut" style="margin:10px 0 0">Ingresos por medio: ${byM}</p>
    ${(() => { const t = live.filter(m => m.type==='retiro').reduce((a,m) => a+m.amount, 0); return t ? `<p class="mut" style="margin:4px 0 0">Retiros de efectivo: ${fmt(t)} (no cuentan como gasto)</p>` : ''; })()}
    ${(() => { const t = live.filter(m => m.type==='aporte').reduce((a,m) => a+m.amount, 0); return t ? `<p class="mut" style="margin:4px 0 0">Efectivo agregado: ${fmt(t)} (no cuenta como venta)</p>` : ''; })()}
    <p class="mut" style="margin:4px 0 0">Cobros por cuenta, día: ${accs}</p>
    <p class="mut" style="margin:4px 0 0">Cobros por cuenta, mes: ${monthAccs}</p>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--tx)"><input type="checkbox" id="hp" ${histPending?'checked':''}> Ver solo cobros sin verificar, de todos los días${pendAll ? ' (' + pendAll + ' pendientes)' : ''}</label></div>
    <div class="card">${movTable(ms)}</div>`;
  $('#hd').addEventListener('change', e => { histDay = e.target.value || today(); vHist(); });
  $('#hp').addEventListener('change', e => { histPending = e.target.checked; vHist(); });
}
function exportCsv(){
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const rows = [['fecha','tipo','concepto','cliente','medio','cuenta','verificado','monto','anulado','detalle'].join(',')].concat(S.movements.map(m => [m.ts,m.type,m.concept,m.who||'',m.method,m.account?accLabel(m.account):'',m.verified?'si':'',m.amount,m.voided?'si':'',(m.items||[]).map(i=>i.qty+'x '+i.name).join('; ')].map(q).join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv'})); a.download = 'movimientos-caja.csv'; a.click();
}

boot();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
